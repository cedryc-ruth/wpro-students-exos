<html>
<body>
<script>
//Dzhem Hasanov


/*
Compte le nombre des valeurs positives et le nombre des valeurs négatives, calcule la somme des valeurs positives.
*/
do(


var nb;
var total;
var cptpose;
var cptneg;


total = 0;
cptpose = 0;
cptneg = 0;


nb=prompt("Veuillez entrer un nombre");
nb=parseInt(nb);


if(nb>0){

	total= (total+nb);
	cptpose=(cptpose+total);
}	
else if(nb!==0){
	cptneg = (cptneg+nb);
}

document.write( cptpose + cptneg + total);

)while{
nb!==0
}

</script>
</body>
</html>
