<script>
//Alexandre cédolin

/*Compte le nombre de valeur positive et de valeur négative calcule la somme des valeurs positives
*
*/

var nb;
var total;
var cpt-pos;
var cpt-neg;

total = 0;
cpt-pos = 0; 
cpt-neg = 0;

do(){
nb = prompt('donnez un nombre');

nb = parseFloat(nb)

if (nb>0){

	total = total+nb;
	cpt-pos = total;
	
}
else  (nb!=0){
	cpt-neg = cpt-neg+nb;

}
document.write(cpt-pos + cpt-neg + total);
} while

</script>
