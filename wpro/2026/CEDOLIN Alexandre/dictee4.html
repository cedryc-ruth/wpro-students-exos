<script>
/**
 * Compte le nombre de valeur positive et de valeur négative calcule la somme des valeurs positives
 *
 * @author Alexandre Cédolin
 */

var nb;
var total;
var cptPos;
var cptNeg;

total = 0;
cptPos = 0; 
cptNeg = 0;

do {
	nb = prompt('Veuillez donnez un nombre.');
	nb = parseFloat(nb)

	if (nb>0){
		total = total+nb;
		cptPos = total;
	} else if(nb!=0) {
		cptNeg = cptNeg+nb;
	}
	
	document.write('<p>Nb positifs: '+cptPos +' - Nb négatifs: '+ cptNeg +' - Total: '+ total+'</p>');
} while(nb!=0);
</script>
