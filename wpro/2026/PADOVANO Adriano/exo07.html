<meta charset="utf-8">
<script>
/**
 * 7. Écrivez un programme qui affiche le montant de la prime d’un vendeur lorsqu’il a entré son chiffre de vente
 * (prime de 10% sur son chiffre de vente s’il a vendu pour plus de 1000 €).
 * 
 * @author A. Padovano
 */
 
 //Déclaration des variables
var chiffreVente;
var montant;
const PRIME = 0.1;
const SEUIL_VENTE = 1000;

 //Lecture des données
chiffreVente = parseFloat (prompt('Entrez votre chiffre de vente.'));

 //Traitement des données
montant = chiffreVente*PRIME;
	
//Affichage
if (chiffreVente>=SEUIL_VENTE) {
	document.write('<p>Le montant de votre prime est de '+montant.toFixed(2)+' €.</p>');
} else  {
	document.write('<p>Vous n\'êtes pas éligible à la prime.</p>');
}
</script>
