<meta charset="utf-8">
<script>
/**
 * 6. Écrivez un programme qui vérifie si un nombre entré par l’utilisateur est compris entre 10 et 20.
 * 
 * @author A. Padovano
 */
 
 //Déclaration des variables
var nb;

 //Lecture des données
nb = parseFloat(prompt('Entrez un nombre entre 10 et 20.'));

 //Traitement des données
if (nb>=10 && nb<=20) {
	document.write('<p>'+nb+' est un nombre entre 10 et 20.</p>');
}
else {
	document.write('<p>'+nb+' n\'est pas un nombre entre 10 et 20.</p>');
}

 //Affichage

</script>
