<script>
/**
* Programme qui affiche le montant de la prime d’un vendeur 
* lorsqu’il a entré son chiffre de vente 
* (prime de 10% sur son chiffre de vente s’il a vendu pour plus de 1000 €).
*
* Idem mais primes progressives :  0-500 => 2%, 501-1000 => 5%, plus de 1000 => 10%
*
* @author B. MRABET
*/

var prime; 
var chiffreVente;
const SEUIL_VENTE_MIN = 500;
const SEUIL_VENTE_MEDIUM = 1000;
const TAUX_PRIME_MIN = 0.02;
const TAUX_PRIME_MEDIUM = 0.05;
const TAUX_PRIME_MAX = 0.1;
	
chiffreVente = parseFloat(prompt('Quel est ton chiffre de vente'));

if(chiffreVente >= SEUIL_VENTE_MEDIUM) {
	prime = chiffreVente * TAUX_PRIME_MAX;
	document.write('<p>Voici le montant de ta prime: '+ prime.toFixed(2) +' </p>');
} else if (chiffreVente > SEUIL_VENTE_MIN && chiffreVente < SEUIL_VENTE_MEDIUM){
	prime = chiffreVente * TAUX_PRIME_MEDIUM;
	document.write('<p>Voici le montant de ta prime: '+ prime.toFixed(2) +' </p>');
} else {
	prime = chiffreVente * TAUX_PRIME_MIN;
	document.write('<p>Voici le montant de ta prime: '+ prime.toFixed(2) +' </p>');
	
	//.toFixed(3) pour limiter les décimales (ici max 3 décimales) 
	//il arrondit vers le bas ou vers le haut
}
</script>
