 <script>
 /**
 * Écrivez un programme qui demande à l’utilisateur de deviner un nombre compris entre 0 et 10. 
 * Le nombre à deviner n’est pas fourni par l’utilisateur bien sûr. 
 * Il devra être généré aléatoirement grâce à la fonction random.
 * L'utilisateur a droit à une seule tentative. Si la réponse est trouvée, le programme s'arrête.
 *
 * @author B. MRABET
 */
 
 const nbSecret = Math.floor(Math.random()*10);
 var nbUtilisateur;
 
 nbUtilisateur= parseInt(prompt('Devinez le nombre secret compris entre 0 et 10'));
 
 if( nbSecret == nbUtilisateur){
	document.write('<p>Bravo vous avez trouvé le nombre secret: ' + nbSecret +'</p>');
 } else {
	document.write('<p>Dommage le nombre était'+ nbSecret +'</p>');
 }
 </script>
