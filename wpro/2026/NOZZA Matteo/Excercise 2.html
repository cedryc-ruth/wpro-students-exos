<script>
/**
 * De quelle ristourne bénéficierait un client 
 * qui présente un code promo de 15%
 * pour un produit qui coûte 90 euros ?
 *
 * @author N. Matteo
 */

var prix = 90; 
var codePromo = 15; 
var prixAvecRistourne = (prix * (codePromo/100)); // Ajout de 'var'
var calculPrixAvecRistourne = (prix - prixAvecRistourne); // Ajout de 'var'
  
document.write('<p>Le prix est ' + calculPrixAvecRistourne + '€</p>'); 
document.write('<p>Vous avez économisé ' + prixAvecRistourne + '€</p>'); 
</script>
