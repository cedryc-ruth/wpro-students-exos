<script>
/**
 * Le salaire de Lydia est actuellement de 2500 € avec une indexation tous les 2 ans de 4%.
 * Son salaire augmentera-t-il plus vite dans 10 ans 
 * si elle décide de rejoindre l'entreprise Beta qui lui propose 2800 euros 
 * avec une augmentation tous les 5 ans de 8% ?
 *
 * @author N. Matteo
 */

var salaireActuel = 2500;
var salaireBeta = 2800;
var ligne;

document.write("<p>Année : Actuel - Beta</p>");
document.write("0 : " + salaireActuel + " € - " + salaireBeta + " €\n</p>");

for (var annee = 1; annee <= 10; annee++) {
  if (annee % 2 === 0) {
    salaireActuel *= 1.04;
  }
  
  if (annee % 5 === 0) {
    salaireBeta *= 1.08;
  }

  ligne = "<p>" + annee + " : " + salaireActuel.toFixed(2) + " € - " + salaireBeta.toFixed(2) + " €</p>"  
  document.write(ligne);
}
</script>
