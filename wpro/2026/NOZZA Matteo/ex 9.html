<script>
//génération random 
var nbSecret = Math.floor(Math.random() * 11);
var tentative = parseInt(prompt('Un numéro entre 0 et 10'));

// verification et affichage
if (tentative === nbSecret) {
    document.write('<p>Bravo, vous avez trouvé !</p>');
} else {
    document.write('<p>Dommage, le nombre mystère était ' + nbSecret + '.</p>');
}
</script>
